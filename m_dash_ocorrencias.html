<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Ocorrências</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F1F5F9;
            --bg-panel: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #CBD5E1;
            --primary: #ef4444; /* Red for Ocorrencias */
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg-body); color: var(--text-main); }
        .m-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .m-back-btn { background: none; border: none; color: var(--text-main); padding: 8px; margin: -8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .m-header-title { font-size: 18px; font-weight: 600; margin: 0; }
        
        .m-container { padding: 16px; padding-bottom: 80px; }
        
        .m-action-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .m-action-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        .m-select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none; }
        .m-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(239,68,68,0.25); }
        
        .m-metrics-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .m-metrics-month { font-size: 12px; color: var(--primary); font-weight: 500; background: rgba(239,68,68,0.1); padding: 4px 8px; border-radius: 12px; }
        .m-metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .m-metric-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center; }
        .m-metric-card.full { grid-column: span 2; }
        .m-metric-val { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .m-metric-label { font-size: 12px; color: var(--text-muted); line-height: 1.2; }
        .m-metric-icon { color: var(--primary); margin-bottom: 8px; opacity: 0.8; }
        
        .m-list-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
        .m-list-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        .m-list-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); flex-direction: column; gap: 4px; }
        .m-list-item:last-child { border-bottom: none; padding-bottom: 0; }
        
    </style>
</head>
<body>

    <header class="m-header">
        <button class="m-back-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 class="m-header-title">Ocorrências</h1>
    </header>

    <div class="m-container">
        
        <div class="m-action-card">
            <div class="m-action-title">Registrar Ocorrência</div>
            <select id="selFamilia" class="m-select">
                <option value="">Carregando famílias...</option>
            </select>
            <button id="btnNovaOcorrencia" class="m-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                Nova Ocorrência
            </button>
        </div>

        <div class="m-metrics-title">
            Resumo do Mês
            <span class="m-metrics-month" id="txtMesAtual">Mês Atual</span>
        </div>
        
        <div class="m-metrics-grid">
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 3v5h5"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                <div class="m-metric-val" id="valTotal">--</div>
                <div class="m-metric-label">Total Registrado</div>
            </div>
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <div class="m-metric-val" id="valGraves">--</div>
                <div class="m-metric-label">Ocorrências Graves</div>
            </div>
            <div class="m-metric-card full">
                <div class="m-metric-label" style="font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 8px;">Por Categoria</div>
                <div id="valCategorias" style="font-size: 12px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>

        <div class="m-list-card">
            <div class="m-list-title">Últimas Ocorrências</div>
            <div id="lstRecentes" style="font-size: 13px; color: var(--text-muted);">
                Carregando...
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="m_dash_ocorrencias.js"></script>

</body>
</html>
