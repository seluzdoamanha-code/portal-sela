<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestão - Atendimento Fraterno</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    <style>
        .m-header-nav {
            display: flex; align-items: center; height: 60px; padding: 0 16px;
            background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .m-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
        .m-back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; margin-left: -8px; }
        
        .m-tabs {
            display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 60px; z-index: 90;
        }
        .m-tab {
            flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 500;
            color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .m-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .sub-tab-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
            background: rgba(255,255,255,0.05); color: var(--text-muted);
            border: 1px solid var(--border); cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .sub-tab-pill.active {
            background: rgba(99, 102, 241, 0.15); color: var(--primary);
            border-color: rgba(99, 102, 241, 0.4);
        }
        
        .list-container { padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
        
        .card-atendimento {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-weight: 600; font-size: 16px; color: var(--text-main); margin-bottom: 4px; }
        .card-date { font-size: 12px; color: var(--text-muted); }
        .status-badge {
            font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 12px;
        }
        .status-pendente { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-atendido { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        
        .card-info { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .card-info strong { color: var(--text-main); font-weight: 500; }
        
        .card-actions {
            margin-top: 16px; display: flex; gap: 8px;
        }
        .btn-action {
            flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; text-align: center;
        }
        .btn-mark { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
    <header class="m-header-nav">
        <button class="m-back-btn" id="btnVoltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Gestão - Fraterno</div>
    </header>
    <div id="statsDashboardMobile" style="display: flex; gap: 8px; padding: 10px 16px; background: rgba(255,255,255,0.01); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;"></div>

    <div class="m-tabs" style="overflow-x: auto; white-space: nowrap; display: flex; scrollbar-width: none;">
        <div class="m-tab active" data-main="triagem" style="flex: none; min-width: 120px; padding: 12px 16px;">📋 Triagem</div>
        <div class="m-tab" data-main="fichario" style="flex: none; min-width: 120px; padding: 12px 16px;">🗂️ Fichário</div>
        <div class="m-tab" data-main="atendimento" style="flex: none; min-width: 130px; padding: 12px 16px;">🧑‍🤝‍🧑 Atendimento Fraterno</div>
        <div class="m-tab" data-main="acompanhamento" style="flex: none; min-width: 150px; padding: 12px 16px;">🔎 Tratamentos Fluídico e Espiritual</div>
        <div class="m-tab" data-main="historico" style="flex: none; min-width: 130px; padding: 12px 16px;">📊 Histórico</div>
    </div>

    <!-- Sub-abas -->
    <div id="subTabsContainer" style="display: flex; gap: 8px; padding: 12px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;">
        <!-- Pills injetadas via JS -->
    </div>

    <main class="m-viewport" style="overflow-y: auto;">
        <div class="list-container" id="listaAtendimento">
            <div class="empty-state">Carregando...</div>
        </div>
    </main>

    <!-- Modal Ficha de Atendimento Fraterno -->
    <div id="modalFicha" class="m-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 16px; box-sizing: border-box;">
        <div style="background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; max-width: 600px; margin: 0 auto; padding: 20px; color: var(--text-main); position: relative;">
            <button onclick="fecharModalFicha()" style="position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
            
            <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">🤝 Ficha de Atendimento</h2>
            
            <!-- Info do Paciente -->
            <div id="fichaInfoPaciente" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; color: var(--text-muted);">
                <!-- Preenchido via JS -->
            </div>
            
            <!-- Histórico de Atendimentos Anteriores (Máximo 4) -->
            <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--primary);">📜 Histórico de Sessões</h3>
            <div id="fichaHistoricoSessoes" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                <!-- Listagem via JS -->
            </div>
            
            <!-- Lançar Nova Sessão -->
            <div id="fichaNovaSessaoContainer">
                <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #f59e0b;">➕ Nova Sessão de Atendimento</h3>
                <textarea id="txtSintomasOrientacoes" placeholder="Escreva os sintomas identificados e as orientações fornecidas ao necessitado..." style="width: 100%; height: 100px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white; padding: 10px; font-size: 14px; font-family: inherit; resize: none; box-sizing: border-box; margin-bottom: 16px; outline: none;"></textarea>
            </div>
            
            <!-- Prescrição de Tratamentos -->
            <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #10b981;">🩹 Prescrever Tratamentos</h3>
            <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="chkTratFluidico" style="width: 18px; height: 18px; accent-color: var(--primary);">
                    Indicar **Tratamento Fluídico**
                </label>
                
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="chkTratEspiritual" style="width: 18px; height: 18px; accent-color: var(--primary);">
                    Indicar **Tratamento Energético/Espiritual**
                </label>
            </div>
            
            <div style="display: flex; gap: 12px;">
                <button onclick="salvarFichaAtendimento()" class="btn-action" style="background: var(--primary); color: white; border: none; font-size: 14px; padding: 12px; border-radius: 8px; width: 100%;">Gravar Sessão e Prescrever</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="m_atendimento_gestao.js?v=21"></script>
</body>
</html>
