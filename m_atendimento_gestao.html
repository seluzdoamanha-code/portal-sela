<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestão - Atendimento Fraterno</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    <style>
        .m-header-nav {
            display: flex; align-items: center; height: 60px; padding: 0 16px;
            background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .m-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
        .m-back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; margin-left: -8px; }
        
        .m-tabs {
            display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 60px; z-index: 90;
        }
        .m-tab {
            flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 500;
            color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .m-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .list-container { padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
        
        .card-atendimento {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-weight: 600; font-size: 16px; color: var(--text-main); margin-bottom: 4px; }
        .card-date { font-size: 12px; color: var(--text-muted); }
        .status-badge {
            font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 12px;
        }
        .status-pendente { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-atendido { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        
        .card-info { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .card-info strong { color: var(--text-main); font-weight: 500; }
        
        .card-actions {
            margin-top: 16px; display: flex; gap: 8px;
        }
        .btn-action {
            flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; text-align: center;
        }
        .btn-mark { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
    <header class="m-header-nav">
        <button class="m-back-btn" id="btnVoltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Gestão - Fraterno</div>
    </header>

    <div class="m-tabs">
        <div class="m-tab active" data-tab="pendentes">Pendentes</div>
        <div class="m-tab" data-tab="atendidos">Atendidos</div>
    </div>

    <main class="m-viewport">
        <div class="list-container" id="listaPendentes">
            <div class="empty-state">Carregando...</div>
        </div>
        <div class="list-container" id="listaAtendidos" style="display: none;">
            <div class="empty-state">Carregando...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="m_atendimento_gestao.js"></script>
</body>
</html>
