<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal SELA - Agenda</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    <style>
        .m-viewport { 
            padding-bottom: env(safe-area-inset-bottom, 0px); 
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        .m-header-nav {
            display: flex; align-items: center; height: 60px; padding: 0 16px;
            background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .m-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
        .m-back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; margin-left: -8px; }
        
        .agenda-list { padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 100px; }
        .agenda-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 20px; position: relative;
        }
        .agenda-date-badge {
            display: inline-block; background: rgba(99, 102, 241, 0.1); color: #6366f1;
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 12px;
        }
        .agenda-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; padding-right: 24px; }
        .agenda-detail { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; margin-bottom: 6px; }
        .agenda-detail svg { margin-right: 8px; opacity: 0.7; }
        
        .agenda-actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn-google {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-google:active { background: rgba(255,255,255,0.1); }
        
        .btn-delete {
            position: absolute; top: 16px; right: 16px; background: none; border: none;
            color: var(--text-muted); cursor: pointer; padding: 4px;
        }
        .btn-delete:active { color: #ef4444; }

        .m-fab {
            position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px)); right: 24px;
            width: 56px; height: 56px; border-radius: 28px; background: var(--primary);
            color: white; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); border: none; z-index: 900;
        }

        /* Modal Overlay for Event Creation */
        .m-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .m-modal-overlay.active { opacity: 1; }
        .m-modal {
            background: var(--bg-panel); width: 90%; max-width: 400px;
            border-radius: 24px; padding: 24px; border: 1px solid var(--border);
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        .m-modal.active { transform: translateY(0); }
        .m-modal h2 { margin: 0 0 20px 0; font-size: 18px; color: var(--text-main); text-align: center; }
        
        .m-form-group { margin-bottom: 16px; }
        .m-form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .m-input {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            color: var(--text-main); padding: 12px; border-radius: 12px; font-size: 14px;
            box-sizing: border-box;
        }
        .m-modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .m-modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; border: none; font-size: 14px; }
        .m-btn-cancel { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .m-btn-save { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <header class="m-header-nav">
        <button class="m-back-btn" id="btnBack">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Agenda</div>
    </header>

    <main class="m-viewport" id="agendaListContainer">
        <div class="agenda-list" id="agendaList">
            <p style="text-align:center; color: var(--text-muted); padding-top: 40px;">Carregando...</p>
        </div>
    </main>

    <button class="m-fab" id="btnNovoEvento" aria-label="Novo Evento">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Modal Novo Evento -->
    <div class="m-modal-overlay" id="modalNovoEvento">
        <div class="m-modal" id="modalNovoEventoContent">
            <h2>Novo Evento</h2>
            <form id="formNovoEvento">
                <div class="m-form-group">
                    <label class="m-form-label">Título</label>
                    <input type="text" class="m-input" id="evTitulo" required placeholder="Ex: Reunião Geral">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="m-form-group" style="flex: 1;">
                        <label class="m-form-label">Data</label>
                        <input type="date" class="m-input" id="evData" required>
                    </div>
                    <div class="m-form-group" style="flex: 1;">
                        <label class="m-form-label">Hora (Opcional)</label>
                        <input type="time" class="m-input" id="evHora">
                    </div>
                </div>
                <div class="m-form-group">
                    <label class="m-form-label">Local (Opcional)</label>
                    <input type="text" class="m-input" id="evLocal" placeholder="Ex: Sala 2">
                </div>
                <div class="m-form-group">
                    <label class="m-form-label">Descrição (Opcional)</label>
                    <textarea class="m-input" id="evDesc" rows="2"></textarea>
                </div>
                <div class="m-modal-actions">
                    <button type="button" class="m-btn-cancel" id="btnCancelarEvento">Cancelar</button>
                    <button type="submit" class="m-btn-save">Agendar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SweetAlert2 (Para confirmação de exclusão) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="m_agenda.js"></script>
</body>
</html>
