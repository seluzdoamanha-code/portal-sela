<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELA - Diário Evangelização</title>
    
    <!-- Supabase e SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos base e mobile -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="m_style.css">
    
    <!-- Bloqueio de Acesso -->
    <script src="auth_guard.js"></script>
    <link rel="icon" type="image/png" href="logo_sela_color.png">
    
    <style>
        .evang-selector {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .aluno-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .aluno-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .aluno-nome {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }
        
        .presenca-controls {
            display: flex;
            gap: 8px;
        }
        
        .btn-presenca {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-presenca.presente.active {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-color: #10b981;
        }
        
        .btn-presenca.falta.active {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }
        
        .obs-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text-main);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="m-app-container">
        <!-- Topbar Mobile -->
        <header class="m-topbar">
            <button class="m-back-btn" onclick="window.location.href='m_index.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="m-topbar-title">Diário de Classe</div>
        </header>

        <!-- Área de Telas (Stack) -->
        <main class="m-viewport">
            <div class="m-screen" id="screen-diario">
                
                <!-- Seletores (Turma e Aula) -->
                <div class="evang-selector">
                    <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500;">Turma</label>
                    <select id="selMobileTurma" class="input" style="width: 100%; margin-bottom: 16px;" onchange="mobileTurmaChanged()">
                        <option value="">Carregando turmas...</option>
                    </select>
                    
                    <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500;">Aula do Dia</label>
                    <select id="selMobileAula" class="input" style="width: 100%;" onchange="mobileAulaChanged()" disabled>
                        <option value="">Selecione uma turma primeiro</option>
                    </select>
                </div>
                
                <!-- Resumo da Aula -->
                <div id="resumoAulaMobile" style="display: none; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
                    <div style="color: #10b981; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">TEMA PLANEJADO</div>
                    <div id="txtTemaAulaMobile" style="color: var(--text-main); font-size: 14px; font-weight: 500;">...</div>
                </div>

                <!-- Lista de Chamada -->
                <div class="m-section-title" id="tituloChamada" style="display: none;">Lista de Chamada</div>
                
                <div id="listaChamadaMobile">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px;">
                        Selecione a turma e a aula para abrir o diário.
                    </div>
                </div>
                
                <!-- Espaço extra para o botão flutuante não sobrepor -->
                <div style="height: 100px;"></div>
            </div>
        </main>
        
        <!-- FAB - Salvar -->
        <button id="btnSalvarDiario" class="m-fab" style="display: none; background: #10b981; bottom: 24px;" onclick="salvarDiarioMobile()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
    </div>

    <script src="m_evangelizacao.js"></script>
</body>
</html>
