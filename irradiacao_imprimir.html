<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir - Leituras de Irradiação</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-print: #ffffff;
            --text-print: #000000;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-print);
            color: var(--text-print);
            margin: 0;
            padding: 20px;
        }

        /* Oculta os controles na hora de imprimir */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                padding: 0;
            }
        }

        .controls {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            border: 1px solid #e2e8f0;
        }

        .controls select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }

        .controls button {
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .controls button:hover {
            background: #1d4ed8;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        .header h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: normal;
        }

        .header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: normal;
        }

        .list-container {
            margin-top: 16px;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .checkbox {
            font-family: monospace;
            font-size: 16px;
            margin-right: 8px;
            user-select: none;
        }

        .content {
            flex: 1;
        }

        .nome {
            font-weight: bold;
            text-transform: uppercase;
        }

        .endereco {
            margin-left: 4px;
        }

        .empty-state {
            text-align: center;
            font-style: italic;
            color: #64748b;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="controls no-print">
        <label for="selDia"><strong>Filtrar por Dia:</strong></label>
        <select id="selDia">
            <option value="">Todos os dias</option>
            <option value="Segunda-feira">Segunda-feira</option>
            <option value="Terça-feira">Terça-feira</option>
            <option value="Quarta-feira (Desobsessão)">Quarta-feira (Desobsessão)</option>
            <option value="Quarta-feira (Desencarnado)">Quarta-feira (Desencarnado)</option>
            <option value="Quinta-feira">Quinta-feira</option>
        </select>
        <button onclick="window.print()">🖨️ Imprimir Agora</button>
        <button onclick="window.close()" style="background: #ef4444;">Fechar</button>
    </div>

    <div class="header">
        <h1>SELA - Sociedade Espírita Luz do Amanhã</h1>
        <h2 id="lblData">Atividade de Irradiação - Leituras para Irradiação para o dia Todos os dias</h2>
    </div>

    <div class="list-container" id="listaImpressao">
        <div class="empty-state">Carregando leituras...</div>
    </div>

    <script src="irradiacao_imprimir.js"></script>
</body>

</html>
