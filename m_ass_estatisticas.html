<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Estatísticas - Assistência</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="auth_guard.js"></script>
    <style>
        .m-viewport { 
            padding-bottom: env(safe-area-inset-bottom, 0px); 
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        .m-header-nav {
            display: flex; align-items: center; height: 60px; padding: 0 16px;
            background: var(--bg-panel); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .m-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
        .m-back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
        .stat-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px; position: relative; overflow: hidden;
        }
        .stat-card-title { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
        .stat-card-value { font-size: 24px; font-weight: 700; color: var(--text-main); }
        .stat-card-icon {
            position: absolute; right: 12px; top: 12px;
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .chart-container {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 16px; margin: 0 16px 24px 16px;
        }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text-main); }
    </style>
</head>
<body>
    <header class="m-header-nav">
        <button class="m-back-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Estatísticas e Relatórios</div>
    </header>

    <main class="m-viewport" style="padding-bottom: 80px;">
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="stat-card-title">Famílias Ativas</div>
                <div class="stat-card-value" id="valFamilias">--</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(6, 182, 212, 0.1); color: #06b6d4;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                </div>
                <div class="stat-card-title">Cestas (Mês)</div>
                <div class="stat-card-value" id="valCestasMes">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                </div>
                <div class="stat-card-title">Novos (Mês)</div>
                <div class="stat-card-value" id="valNovos">--</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
                <div class="stat-card-title">Ocorrências (Mês)</div>
                <div class="stat-card-value" id="valOcorrencias">--</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Entregas por Mês (Ano Atual)</div>
            <div style="position: relative; height: 200px; width: 100%;">
                <canvas id="chartEntregas"></canvas>
            </div>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Status das Famílias</div>
            <div style="position: relative; height: 280px; width: 100%;">
                <canvas id="chartDemografia"></canvas>
            </div>
        </div>
    </main>

    <script src="m_ass_estatisticas.js"></script>
</body>
</html>
