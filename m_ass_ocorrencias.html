<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELA - Registrar Ocorrência</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F1F5F9;
            --bg-panel: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #CBD5E1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-body);
            color: var(--text-main);
        }

        .m-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .m-back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 8px;
            margin: -8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .m-header-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .m-container {
            padding: 20px;
        }

        .m-form-group {
            margin-bottom: 20px;
        }

        .m-form-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .m-input, .m-select {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .m-input:focus, .m-select:focus {
            border-color: var(--danger);
        }
        
        .m-input:disabled {
            opacity: 0.7;
        }

        textarea.m-input {
            resize: vertical;
            min-height: 100px;
        }

        .m-btn {
            width: 100%;
            background: var(--danger);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-top: 32px;
        }

        .m-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .m-feedback {
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .m-feedback.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        .m-feedback.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
    </style>
</head>
<body>

    <header class="m-header">
        <button class="m-back-btn" id="btnVoltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 class="m-header-title">Registrar Ocorrência</h1>
    </header>

    <div class="m-container">
        <div class="m-form-group">
            <label class="m-form-label">Família</label>
            <input type="text" id="inpFamilia" class="m-input" disabled value="Carregando...">
        </div>

        <div class="m-form-group">
            <label class="m-form-label">Data da Ocorrência</label>
            <input type="date" id="inpData" class="m-input">
        </div>

        <div class="m-form-group">
            <label class="m-form-label">Código RO</label>
            <input type="text" id="inpCodigo" class="m-input" placeholder="Ex: RO-001">
        </div>

        <div class="m-form-group">
            <label class="m-form-label">Tipo de Ocorrência</label>
            <select id="inpTipo" class="m-select">
                <option value="Normal">Normal (Visita/Acompanhamento)</option>
                <option value="Grave">Grave (Problema/Alerta)</option>
                <option value="Entrega">Problema na Entrega</option>
                <option value="Familiar">Conflito/Questão Familiar</option>
                <option value="Outros">Outros</option>
            </select>
        </div>

        <div class="m-form-group">
            <label class="m-form-label">Relato / Observação</label>
            <textarea id="inpObs" class="m-input" placeholder="Descreva os detalhes da ocorrência..."></textarea>
        </div>

        <div id="divFeedback" class="m-feedback"></div>

        <button id="btnSalvar" class="m-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Salvar Ocorrência
        </button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="m_ass_ocorrencias.js"></script>

</body>
</html>
