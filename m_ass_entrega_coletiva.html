<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrega Coletiva</title>
    <link rel="stylesheet" href="m_style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth_guard.js"></script>
    <style>
        body {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 90px;
        }
        .m-header-nav {
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .m-back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 8px;
            margin-left: -8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .m-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 8px;
        }
        
        .m-date-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 60px;
            z-index: 99;
        }
        .m-date-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .m-date-display {
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
            border: 1px solid var(--border);
            min-width: 130px;
            text-align: center;
        }

        .m-list-container {
            padding: 16px;
        }
        
        .m-family-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .m-fam-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .m-fam-code {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .m-fam-name {
            color: var(--text-main);
            font-weight: 600;
            font-size: 15px;
            flex: 1;
        }
        
        .m-fam-controls {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .m-control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .m-control-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .m-select, .m-input-num {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .m-control-group.qtd {
            flex: 0 0 70px;
        }
        .m-input-num {
            text-align: center;
        }
        
        .m-btn-save-sticky {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            left: 16px;
            right: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .m-btn-save-sticky:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header class="m-header-nav">
        <button class="m-back-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Entrega Coletiva</div>
    </header>

    <div class="m-date-picker">
        <button class="m-date-btn" id="btnPrevMonth">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-date-display" id="dateDisplay">Carregando...</div>
        <button class="m-date-btn" id="btnNextMonth">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
    </div>

    <div class="m-list-container" id="familiasList">
        <p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Carregando dados...</p>
    </div>

    <button id="btnSalvarLote" class="m-btn-save-sticky">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Salvar Entregas
    </button>

    <script src="m_ass_entrega_coletiva.js"></script>
</body>
</html>
