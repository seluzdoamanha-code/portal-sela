<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Tarefeiro - SELA</title>
    <meta property="og:title" content="Portal do Tarefeiro - SELA">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos globais -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Bloqueio de Acesso -->
    <script src="auth_guard.js"></script>
    <link rel="icon" type="image/png" href="logo_sela.png">
    <link rel="apple-touch-icon" href="logo_sela.png">
    <meta property="og:image" content="logo_sela.png">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar injetada pelo sidebar.js -->
        <aside class="sidebar" style="display: none;"></aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px;">
                    <span style="color: var(--primary); font-weight: 500;">Portal SELA</span>
                    <span style="font-size: 10px;">▶</span>
                    <span>Painel Inicial</span>
                </div>
            </header>

            <div class="content-body" id="mainBody">
                
                <!-- Vitrine de Eventos Globais (Injetada automaticamente pelo sidebar.js se existir este ID) -->
                <div id="vitrineEventos" style="display: none; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px;">
                    <div style="font-size: 14px; font-weight: 600; color: #ef4444; display: flex; align-items: center; gap: 8px;">
                        <span>🚨</span> Próximos Eventos da Casa
                    </div>
                    <div id="listaEventosGlobais" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
                        <!-- Eventos injetados aqui via JS -->
                    </div>
                </div>

                <div class="mural-grid" style="margin-top: 24px;">
                    
                    <!-- Lado Esquerdo: Mural de Recados / Posts -->
                    <div class="feed-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h2 style="font-size: 18px;">Mural de Informações</h2>
                            <button id="btnNovoPost" class="btn btn-primary" style="font-size: 12px; padding: 6px 12px;">+ Novo Post</button>
                        </div>
                        
                        <div id="loadingFeed" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 24px;">Carregando Mural...</div>
                        
                        <div id="listaPosts" style="display: flex; flex-direction: column; gap: 16px;">
                            <!-- Posts Injetados via JS -->
                        </div>
                    </div>

                    <!-- Lado Direito: Atalhos e Resumo -->
                    <div class="widgets-section" style="display: flex; flex-direction: column; gap: 24px;">
                        
                        <!-- Resumo Estatístico -->
                        <div style="background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px;">
                            <h3 style="font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 16px;">Visão Geral</h3>
                            
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">👥 Assoc. Efetivos</span>
                                    <span id="statEfetivos" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">👥 Assoc. Proponentes</span>
                                    <span id="statProponentes" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">👥 Demais Pessoas (PF)</span>
                                    <span id="statDemaisPessoas" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">🏢 Empresas (PJs)</span>
                                    <span id="statEmpresas" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">🏛️ Departamentos</span>
                                    <span id="statDepartamentos" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                                    <span style="font-size: 13px; color: #cbd5e1;">🎯 Atividades</span>
                                    <span id="statAtividades" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: 13px; color: var(--text-muted);">📦 Outros</span>
                                    <span id="statOutros" style="font-size: 16px; font-weight: bold; color: var(--text-muted);">0</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Novo Post -->
    <div id="modalPost" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <header class="modal-header">
                <h2>Escrever no Mural</h2>
                <button class="btn-close" id="btnClosePost">×</button>
            </header>
            <form id="formPost" class="modal-body">
                <div class="form-group">
                    <label>Título do Comunicado</label>
                    <input type="text" id="inPostTitulo" placeholder="Ex: Doações para o Bazar" required>
                </div>
                <div class="form-group">
                    <label>Conteúdo (Use Markdown opcionalmente)</label>
                    <textarea id="inPostConteudo" rows="6" placeholder="Escreva a mensagem..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Autor / Departamento</label>
                    <input type="text" id="inPostAutor" placeholder="Ex: Diretoria SELA" required>
                </div>
                <div class="form-group">
                    <label>Link Externo (Opcional - Gera card igual WhatsApp)</label>
                    <input type="url" id="inPostLink" placeholder="https://youtube.com/...">
                </div>
                <div class="form-group" style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" id="btnSavePost" style="flex: 1;">Publicar no Mural</button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalPost').style.display='none'" style="flex: 1;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Carrega a biblioteca Marked para posts em markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Supabase e Scripts -->
    
    <script src="sidebar.js?v=3"></script>
    <script src="index.js"></script>
</body>
</html>
