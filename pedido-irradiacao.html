<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Irradiação | Portal SELA</title>
    
    <!-- Metatags para WhatsApp e Redes Sociais (Open Graph) -->
    <meta property="og:title" content="Irradiação Espiritual | Portal SELA">
    <meta property="og:description" content="Faça solicitações de tratamento espiritual à distância para você ou seus entes queridos.">
    <meta property="og:image" content="https://comunidade-sela.vercel.app/logo_sela.png">
    <meta property="og:url" content="https://comunidade-sela.vercel.app/">
    <meta property="og:type" content="website">
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase CDN -->
    
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            box-sizing: border-box;
        }
        
        .container-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo-area h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }
        
        .logo-area p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .dias-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .tag-checkbox-ui {
            background: rgba(0, 0, 0, 0.03);
            border: 2px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            line-height: 1.4;
        }
        
        .tag-checkbox-ui:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }
        
        .tag-checkbox-ui input[type="checkbox"] {
            display: none;
        }
        
        .tag-checkbox-ui input[type="checkbox"]:checked + .tag-content {
            color: var(--primary);
            font-weight: 600;
        }
        
        .tag-checkbox-ui.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.2);
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.3);
        }
        
        .tag-content {
            font-size: 14px;
        }
        
        .tag-sub {
            font-weight: normal;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            color: var(--text-muted);
        }
        
        .tag-checkbox-ui.selected .tag-sub {
            color: var(--primary-light, #a5b4fc);
        }
        
        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 16px;
        }
        
        .input-field {
            border: 2px solid rgba(148, 163, 184, 0.6) !important;
            padding: 12px 16px !important;
            background-color: rgba(0, 0, 0, 0.02) !important;
            border-radius: 8px !important;
            font-size: 15px !important;
        }
        .input-field:focus {
            border-color: var(--primary) !important;
            background-color: rgba(255, 255, 255, 0.08) !important;
            outline: none;
        }
        
        /* Painel de Sucesso */
        #panelSuccess {
            display: none;
            text-align: center;
        }
        
        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .resume-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }
        
        .btn-danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        @media (max-width: 480px) {
            .dias-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bloqueio de Acesso -->
    <script src="auth_guard.js"></script>
    <link rel="icon" type="image/png" href="logo_sela.png">
</head>
<body>

    <div class="container-box">
        <div class="logo-area">
            <img src="logo_sela.png" alt="Portal SELA" style="max-width: 140px; margin-bottom: 16px; border-radius: 8px;">
            <h1 style="font-size: 22px;">✨ Irradiação Espiritual</h1>
            <p>Solicitação de Tratamento Espiritual</p>
        </div>

        <!-- Formulário -->
        <form id="formIrradiacao">
            <div class="form-group">
                <label for="inNome">Nome(s) Completo(s) do(s) Necessitado(s) *</label>
                <input type="text" id="inNome" class="input-field" required placeholder="EX: MARIA DA SILVA --- JOSÉ DA SILVA" style="width: 100%; box-sizing: border-box; text-transform: uppercase;">
            </div>
            
            <div class="form-group">
                <label>Endereço Completo</label>
                <input type="text" id="inEndereco" class="input-field" placeholder="RUA, NÚMERO, BAIRRO, CIDADE" style="width: 100%; box-sizing: border-box; text-transform: uppercase;">
            </div>
            
            <div class="form-group">
                <label>Selecione os dias para Irradiação *</label>
                <div class="dias-grid">
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Segunda-feira">
                        <div class="tag-content">Segunda-feira</div>
                        <div class="tag-sub">(Influênciação espiritual)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Terça-feira">
                        <div class="tag-content">Terça-feira</div>
                        <div class="tag-sub">(Saúde física/espiritual)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quarta-feira (Desobsessão)">
                        <div class="tag-content">Quarta-feira</div>
                        <div class="tag-sub">(Desobsessão)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quarta-feira (Desencarnado)">
                        <div class="tag-content">Quarta-feira</div>
                        <div class="tag-sub">(Desencarnado)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quinta-feira">
                        <div class="tag-content">Quinta-feira</div>
                        <div class="tag-sub">(Saúde física/espiritual)</div>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Enviar Solicitação</button>
        </form>

        <!-- Painel de Sucesso -->
        <div id="panelSuccess">
            <div class="success-icon">✅</div>
            <h2 style="color: #10b981; margin: 0 0 8px 0;">Solicitação Enviada!</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0;">O nome foi adicionado à caixa de entrada da equipe de Irradiação.</p>
            
            <div class="resume-box" id="resumeContent">
                <!-- Preenchido via JS -->
            </div>
            
            <button onclick="novaSolicitacao()" class="btn btn-primary btn-block">Fazer Nova Solicitação</button>
            <button onclick="cancelarSolicitacao()" class="btn btn-danger" id="btnCancel">Apagar Solicitação (Cancelar)</button>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://aymdooyafimliiggxeqs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5bWRvb3lhZmltbGlpZ2d4ZXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMDUxNDksImV4cCI6MjEwMDY4MTE0OX0.-NBhiyGDlrWq4QKNLx9Ll5GlIk0mV_rBWnr0vdbUCOU';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let estruturaId = urlParams.get('id') || '24c0069b-e161-4a03-8599-c4ae054301e3'; // Default para SELA
        
        let lastInsertedIds = [];

        function toggleSelected(labelElement) {
            const chk = labelElement.querySelector('input');
            setTimeout(() => {
                if(chk.checked) {
                    labelElement.classList.add('selected');
                } else {
                    labelElement.classList.remove('selected');
                }
            }, 10);
        }

        document.getElementById('formIrradiacao').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            const nome = document.getElementById('inNome').value.toUpperCase();
            const endereco = document.getElementById('inEndereco').value.toUpperCase();
            
            const checkboxes = document.querySelectorAll('.chk-dia:checked');
            const dias = Array.from(checkboxes).map(c => c.value);
            
            if (dias.length === 0) {
                alert("Selecione pelo menos um dia para a Irradiação.");
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                const recordsToInsert = dias.map(dia => ({
                    estrutura_id: estruturaId,
                    nome_solicitado: nome,
                    endereco: endereco,
                    dias_semana: dia,
                    status: 'pendente',
                    leituras: 0,
                    criado_por: 'Site Externo'
                }));
                
                const { data, error } = await db.from('app_irradiacao_solicitacoes').insert(recordsToInsert).select();
                if (error) throw error;
                
                // Salvar IDs em memória para poder cancelar
                lastInsertedIds = data.map(r => r.id);
                
                // Mostrar Sucesso
                document.getElementById('formIrradiacao').style.display = 'none';
                document.getElementById('panelSuccess').style.display = 'block';
                
                document.getElementById('resumeContent').innerHTML = `
                    <strong>Nome:</strong> ${nome}<br>
                    <strong>Endereço:</strong> ${endereco || 'Não informado'}<br>
                    <strong style="display:block; margin-top:8px;">Dias:</strong> 
                    ${dias.join('<br>')}
                `;
                
            } catch (err) {
                console.error(err);
                alert("Erro ao enviar solicitação. Tente novamente.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Solicitação';
            }
        });

        function novaSolicitacao() {
            document.getElementById('formIrradiacao').reset();
            document.querySelectorAll('.tag-checkbox-ui').forEach(el => el.classList.remove('selected'));
            document.getElementById('formIrradiacao').style.display = 'block';
            document.getElementById('panelSuccess').style.display = 'none';
            lastInsertedIds = []; // Limpa memória
        }

        async function cancelarSolicitacao() {
            if (lastInsertedIds.length === 0) return;
            if (!confirm("Tem certeza que deseja cancelar e apagar esta solicitação?")) return;
            
            const btn = document.getElementById('btnCancel');
            btn.disabled = true;
            btn.textContent = 'Apagando...';
            
            try {
                for (const id of lastInsertedIds) {
                    await db.from('app_irradiacao_solicitacoes').delete().eq('id', id);
                }
                alert("Solicitação apagada com sucesso.");
                novaSolicitacao();
            } catch (err) {
                console.error(err);
                alert("Erro ao apagar solicitação.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Apagar Solicitação (Cancelar)';
            }
        }
    </script>
</body>
</html>
