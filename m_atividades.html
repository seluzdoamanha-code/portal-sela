<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal SELA - Atividades</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    
    <!-- Meta tags nativas -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo_sela_color.png">
    <link rel="icon" type="image/png" href="logo_sela_color.png">

    <style>
        .m-search-box {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding-top: 8px;
            padding-bottom: 16px;
            z-index: 10;
        }
        .m-search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }
        .m-search-input:focus {
            border-color: var(--primary);
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    
    <header class="m-header">
        <div class="m-header-title">Atividades</div>
    </header>

    <main class="m-viewport">
        <div class="m-screen" id="screen-pessoas">
            
            <div class="m-search-box">
                <div class="m-search-bar" style="position: relative;">
                    <input type="text" id="mSearchInput" class="m-search-input" placeholder="Buscar departamento ou atividade..." autocomplete="off" style="padding-right: 48px;">
                    <button id="btnToggleFilter" style="position: absolute; right: 8px; top: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </button>
                </div>
                
                <div id="mFilterPanel" class="m-filter-panel" style="display: none; padding-top: 12px; gap: 8px; flex-direction: column;">
                    <div style="display: flex; gap: 8px;">
                        <select id="mFilterTag" class="m-search-input" style="padding: 10px; font-size: 14px; flex: 1; background-color: var(--bg-panel);">
                            <option value="">Todos os Tipos</option>
                            <option value="Departamento">Departamentos</option>
                            <option value="Atividade">Atividades</option>
                            <option value="Família">Famílias</option>
                            <option value="Turma">Turmas</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Dashboard de Totais -->
            <div id="mDashboardStats" style="display: flex; gap: 8px; padding: 0 16px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none;">
                <!-- Preenchido pelo JS -->
            </div>

            <!-- Lista de Pessoas -->
            <div id="mLoadingState" style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px;">
                Carregando atividades...
            </div>
            
            <div id="mListContainer">
                <!-- Cards serão injetados aqui -->
            </div>
            
        </div>
    </main>

    <!-- Floating Action Button para Adicionar -->
    <button id="btnAdicionar" style="
        position: fixed;
        bottom: calc(var(--safe-bottom) + 80px); /* Acima da Bottom Nav */
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 28px;
        background: var(--primary);
        color: white;
        border: none;
        font-size: 28px;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        cursor: pointer;
        z-index: 100;
        transition: transform 0.2s;
    " onclick="window.location.href='m_hub.html?action=new'">
        +
    </button>

    <nav class="m-bottom-nav">
        <a href="m_index.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
            <span class="m-nav-label">Início</span>
        </a>
        <a href="m_atividades.html" class="m-nav-item active">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg></span>
            <span class="m-nav-label">Atividades</span>
        </a>
        <a href="m_pessoas.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
            <span class="m-nav-label">Pessoas</span>
        </a>
        <a href="m_config.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
            <span class="m-nav-label">Config.</span>
        </a>
    </nav>

    <script src="m_atividades.js"></script>
</body>
</html>
