<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal SELA - Registrar Entrega</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    <link rel="icon" type="image/png" href="logo_sela_color.png">
    <style>
        .m-header-nav {
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .m-back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 8px;
            margin-left: -8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .m-title {
            font-size: 16px;
            font-weight: 600;
            margin-left: 8px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .m-form-container {
            padding: 20px;
        }
        .m-form-group {
            margin-bottom: 20px;
        }
        .m-form-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .m-input, .m-select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .m-input:focus, .m-select:focus {
            border-color: var(--primary);
        }
        .m-input:disabled {
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
        }
        
        .m-btn-save {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }
        .m-btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    
    <header class="m-header-nav">
        <button class="m-back-btn" id="btnVoltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="m-title">Registrar Entrega</div>
    </header>

    <main class="m-viewport" style="overflow-y: auto;">
        <div class="m-form-container">
            
            <div class="m-form-group">
                <label class="m-form-label">Família</label>
                <input type="text" id="inpFamilia" class="m-input" disabled value="Carregando...">
            </div>
            
            <div class="m-form-group">
                <label class="m-form-label">Data da Entrega</label>
                <input type="date" id="inpData" class="m-input" required>
            </div>
            
            <div class="m-form-group">
                <label class="m-form-label">Tipo de Cesta</label>
                <select id="inpModelo" class="m-select" required>
                    <option value="">Carregando modelos...</option>
                </select>
            </div>
            
            <div class="m-form-group">
                <label class="m-form-label">Quantidade de Cestas</label>
                <input type="number" id="inpQtd" class="m-input" value="1" min="1" required>
            </div>
            
            <div class="m-form-group">
                <label class="m-form-label">Observações (Opcional)</label>
                <input type="text" id="inpObs" class="m-input" placeholder="Algum recado ou nota?">
            </div>
            
            <button id="btnSalvar" class="m-btn-save">Salvar Entrega</button>
            <div id="mFeedback" style="text-align: center; font-size: 13px; margin-top: 12px; height: 18px; color: #10b981;"></div>
        </div>
    </main>

    <script src="m_ass_entregas.js"></script>
</body>
</html>
