<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Entregas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F1F5F9;
            --bg-panel: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #CBD5E1;
            --primary: #10b981; /* Green for Entregas */
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg-body); color: var(--text-main); }
        .m-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .m-back-btn { background: none; border: none; color: var(--text-main); padding: 8px; margin: -8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .m-header-title { font-size: 18px; font-weight: 600; margin: 0; }
        
        .m-container { padding: 16px; padding-bottom: 80px; }
        
        /* Action Card */
        .m-action-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .m-action-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        .m-select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none; }
        .m-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
        
        /* Metrics Grid */
        .m-metrics-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .m-metrics-month { font-size: 12px; color: var(--primary); font-weight: 500; background: rgba(16,185,129,0.1); padding: 4px 8px; border-radius: 12px; }
        .m-metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .m-metric-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: center; }
        .m-metric-card.full { grid-column: span 2; }
        .m-metric-val { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .m-metric-label { font-size: 12px; color: var(--text-muted); line-height: 1.2; }
        .m-metric-icon { color: var(--primary); margin-bottom: 8px; opacity: 0.8; }
        
        /* List */
        .m-list-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
        .m-list-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        .m-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .m-list-item:last-child { border-bottom: none; padding-bottom: 0; }
        
    </style>
</head>
<body>

    <header class="m-header">
        <button class="m-back-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 class="m-header-title">Entregas de Cesta</h1>
    </header>

    <div class="m-container">
        
        <!-- Action Card: Entrega Coletiva -->
        <div class="m-action-card" style="margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 16px;" onclick="window.location.href='m_ass_entrega_coletiva.html'">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="background: rgba(16, 185, 129, 0.15); padding: 10px; border-radius: 12px; color: #10b981;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div>
                    <div style="color: var(--text-main); font-weight: 600; font-size: 16px;">Entrega Coletiva</div>
                    <div style="color: var(--text-muted); font-size: 13px;">Registrar em lote</div>
                </div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>

        <!-- Action Card: Entrega Individual -->
        <div class="m-action-card">
            <div class="m-action-title">Nova Entrega Individual</div>
            <select id="selFamilia" class="m-select">
                <option value="">Carregando famílias...</option>
            </select>
            <button id="btnNovaEntrega" class="m-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                Registrar Entrega
            </button>
        </div>

        <!-- Metrics -->
        <div class="m-metrics-title">
            Resumo do Mês
            <span class="m-metrics-month" id="txtMesAtual">Mês Atual</span>
        </div>
        
        <div class="m-metrics-grid">
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <div class="m-metric-val" id="valFamilias">--</div>
                <div class="m-metric-label">Famílias<br>Atendidas</div>
            </div>
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <div class="m-metric-val" id="valCestasPeq">--</div>
                <div class="m-metric-label">Cestas Pequenas</div>
            </div>
            
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <div class="m-metric-val" id="valCestasGde">--</div>
                <div class="m-metric-label">Cestas Grandes</div>
            </div>
            
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3v4a2 2 0 0 1-2 2H4"/><path d="M14 3v4a2 2 0 0 0 2 2h4"/><path d="M3 13v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"/><path d="M10 21v-4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v4"/></svg>
                <div class="m-metric-val" id="valLeite">--</div>
                <div class="m-metric-label">Leite Entregue (Litros)</div>
            </div>
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                <div class="m-metric-val" id="valOvosCartelas">--</div>
                <div class="m-metric-label">Cartelas de Ovos</div>
            </div>
            
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                <div class="m-metric-val" id="valOvosUnid">--</div>
                <div class="m-metric-label">Ovos Entregues (Unid.)</div>
            </div>
            <div class="m-metric-card">
                <svg class="m-metric-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <div class="m-metric-val" id="valExtras">--</div>
                <div class="m-metric-label">Cestas Extras (Outros)</div>
            </div>
        </div>

        <!-- Recent List -->
        <div class="m-list-card">
            <div class="m-list-title">Últimas Entregas</div>
            <div id="lstRecentes" style="font-size: 13px; color: var(--text-muted);">
                Carregando...
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="m_dash_entregas.js"></script>

</body>
</html>
