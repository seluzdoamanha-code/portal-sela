<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal SELA Mobile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="auth_guard.js"></script>
    
    <!-- Meta tags nativas -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo_sela.png">
    <link rel="icon" type="image/png" href="logo_sela.png">
</head>
<body>
    
    <!-- Header Principal Fixa -->
    <header class="m-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="logo_sela.png" alt="Logo" style="height: 28px; border-radius: 50%;">
            <div class="m-header-title">Mural do Portal</div>
        </div>
        <button class="m-header-action" id="btnPerfil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></button>
    </header>

    <!-- Área de Telas (Stack) -->
    <main class="m-viewport">
        <!-- Tela Home/Mural -->
        <div class="m-screen" id="screen-home">
            
            <div id="mLoadingState" style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px;">
                Carregando novidades...
            </div>
            
            <div id="mContentArea" style="display: none;">
                <div class="m-section-title">Acesso Rápido</div>
                <!-- Miniaturas (Mini-cards de atalho) -->
                <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; scrollbar-width: none;">
                    <div style="background: var(--bg-panel); border: 1px solid var(--border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center; cursor: pointer;" onclick="window.location.href='m_hub.html?id=6f64f257-23db-4792-8ea9-88183cfe12cd'">
                        <div style="margin-bottom: 8px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"></path></svg></div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Assistência</div>
                    </div>
                    <!-- Mini-app Irradiação -->
                    <div style="background: var(--bg-panel); border: 1px solid var(--border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center; cursor: pointer;" onclick="window.location.href='m_hub.html?id=24c0069b-e161-4a03-8599-c4ae054301e3'">
                        <div style="margin-bottom: 8px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8b5cf6;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Irradiação</div>
                    </div>
                    <!-- Mini-app Atendimento Fraterno -->
                    <div style="background: var(--bg-panel); border: 1px solid var(--border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center; cursor: pointer;" onclick="window.location.href='m_hub.html?id=487401a6-8fc9-4bd6-9ad9-eefe891eb14c'">
                        <div style="margin-bottom: 8px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Atendimento</div>
                    </div>
                    <div style="background: var(--bg-panel); border: 1px solid var(--border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center; cursor: pointer;" onclick="window.open('https://luzdoamanha.org.br/biblioteca', '_blank')">
                        <div style="margin-bottom: 8px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #f59e0b;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Biblioteca</div>
                    </div>
                    <div style="background: var(--bg-panel); border: 1px solid var(--border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center;">
                        <div style="margin-bottom: 8px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #10b981;"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Evangelização</div>
                    </div>
                </div>

                <div class="m-section-title">Mural de Eventos</div>
                <div id="muralContainer">
                    <!-- Cards de evento inseridos por JS -->
                </div>
            </div>
            
        </div>
    </main>

    <!-- Barra de Navegação Inferior -->
    <nav class="m-bottom-nav">
        <a href="m_index.html" class="m-nav-item active">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
            <span class="m-nav-label">Início</span>
        </a>
        <a href="m_atividades.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg></span>
            <span class="m-nav-label">Atividades</span>
        </a>
        <a href="m_pessoas.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
            <span class="m-nav-label">Pessoas</span>
        </a>
        <a href="m_config.html" class="m-nav-item">
            <span class="m-nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
            <span class="m-nav-label">Config.</span>
        </a>
    </nav>

    <script src="m_app.js"></script>
</body>
</html>
